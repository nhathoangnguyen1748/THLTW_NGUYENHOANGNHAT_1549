<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết – LUMINA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #fef9f0; }
        .hero-mini {
            background: #0f2b3d;
            padding: 1rem 0;
        }
        .detail-card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.08);
        }
        .product-img-large {
            border-radius: 1.5rem;
            width: 100%;
            object-fit: cover;
            box-shadow: 0 15px 25px -8px rgba(0,0,0,0.1);
        }
        .btn-return {
            background: #eae4d9;
            border-radius: 60px;
            padding: 0.5rem 1.5rem;
            color: #1e2a3a;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-return:hover {
            background: #d6cdbf;
            transform: translateX(-6px);
        }
        .btn-buy-premium {
            background: #ff6b6b;
            border: none;
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            font-weight: 600;
            color: white;
            transition: 0.2s;
        }
        .btn-buy-premium:hover {
            background: #e05a5a;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="hero-mini text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-white text-decoration-none fw-bold fs-5">✦ LUMINA</a>
            <i class="fas fa-shopping-bag fs-5"></i>
        </div>
    </div>

    <div class="container my-5">
        <a href="index.html" class="btn btn-return mb-4"><i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm</a>

        <div id="productDetailArea" class="row g-5 align-items-center">
            <!-- JS sẽ load nội dung vào đây -->
            <div class="col-md-6">
                <img id="detImg" class="product-img-large img-fluid" src="" alt="">
            </div>
            <div class="col-md-6">
                <div class="detail-card">
                    <h2 id="detName" class="fw-bold mb-3"></h2>
                    <div class="mb-2"><span class="badge bg-warning text-dark">Chính hãng 100%</span></div>
                    <p id="detDesc" class="lead text-secondary mt-3"></p>
                    <div class="display-5 fw-bold text-danger my-4" id="detPrice"></div>
                    <div class="d-flex gap-3">
                        <button class="btn btn-buy-premium"><i class="fas fa-shopping-cart me-2"></i>Mua ngay</button>
                        <button class="btn btn-outline-secondary rounded-pill px-4" onclick="window.location.href='index.html'">Quay lại</button>
                    </div>
                    <hr class="my-4">
                    <div class="row small text-secondary">
                        <div class="col-6"><i class="fas fa-truck-fast me-1"></i> Miễn phí vận chuyển</div>
                        <div class="col-6"><i class="fas fa-undo-alt me-1"></i> Đổi trả 30 ngày</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-premium bg-dark text-white-50 py-4 mt-5 text-center small">
        © 2025 LUMINA – Thiết kế vì cảm hứng công nghệ.
    </footer>

    <script>
        // Dữ liệu sản phẩm chi tiết (có thể fetch từ API)
        const productDetails = {
            1: { name: "AERO X1 Ultra", price: "44.990.000₫", desc: "Siêu phẩm laptop với chip Intel Core Ultra 9, đồ họa RTX 4070, RAM 32GB LPDDR5X, màn 16 inch 3.2K 120Hz, pin 99Wh. Đáp ứng mọi tác vụ sáng tạo và gaming.", image: "https://picsum.photos/id/20/700/500" },
            2: { name: "ORBIT S24 Pro", price: "21.990.000₫", desc: "Điện thoại thông minh đột phá: Snapdragon 8 Gen 3, camera chính 200MP OIS, zoom quang 5x, màn hình Dynamic AMOLED 2X 120Hz, pin 5000mAh sạc siêu tốc 65W.", image: "https://picsum.photos/id/26/700/500" },
            3: { name: "AUDIO HARMONY Z", price: "6.490.000₫", desc: "Tai nghe over-ear chống ồn chủ động hàng đầu, driver 40mm, thời lượng pin 40 giờ, sạc nhanh 10 phút nghe 5 giờ. Kết nối đa điểm Bluetooth 5.3.", image: "https://picsum.photos/id/30/700/500" },
            4: { name: "GLIDE MASTER 3", price: "2.490.000₫", desc: "Chuột không dây cao cấp: cảm biến 8000 DPI, lăn từ tính MagSpeed, 7 nút lập trình, pin 70 ngày, sạc USB-C, kết nối Bluetooth và 2.4GHz.", image: "https://picsum.photos/id/96/700/500" },
            5: { name: "PAD STUDIO M2", price: "27.490.000₫", desc: "Máy tính bảng 12.9 inch Liquid Retina XDR, chip Apple M2, hỗ trợ Apple Pencil hover, dung lượng 256GB, cổng USB-C Thunderbolt, pin cả ngày.", image: "https://picsum.photos/id/42/700/500" },
            6: { name: "MECH VIBE K2", price: "3.290.000₫", desc: "Bàn phím cơ 75% hot-swap, switch Gateron Pro đỏ, đèn nền RGB 16 triệu màu, kết nối Bluetooth/2.4G/USB-C, pin 4000mAh, keycap PBT.", image: "https://picsum.photos/id/0/700/500" }
        };

        const params = new URLSearchParams(window.location.search);
        const pid = params.get('id');

        if (pid && productDetails[pid]) {
            const p = productDetails[pid];
            document.getElementById('detName').innerText = p.name;
            document.getElementById('detPrice').innerText = p.price;
            document.getElementById('detDesc').innerText = p.desc;
            document.getElementById('detImg').src = p.image;
            document.getElementById('detImg').alt = p.name;
        } else {
            document.getElementById('productDetailArea').innerHTML = `
                <div class="alert alert-danger w-100 text-center p-5">
                    <h4><i class="fas fa-exclamation-triangle"></i> Không tìm thấy sản phẩm</h4>
                    <a href="index.html" class="btn btn-primary mt-3">Về trang chủ</a>
                </div>
            `;
        }
    </script>
</body>
</html>
